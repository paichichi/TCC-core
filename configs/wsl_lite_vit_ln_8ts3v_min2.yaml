# WSL TCC-core lite run: method2 ViT-B/16 LN-affine, 8 timestamp groups,
# 3 views, corrected drop-one subset minimum.

data_root: /home/paichichi/data/RH20T/TCC_RH20T
training_index: /home/paichichi/data/RH20T/TCC_RH20T/training_index.pt
pretrain_path: /home/paichichi/data/pretrain/D4R_IN_1M.pth
output_root: /home/paichichi/projects/TCC-core/wsl_result/tcc_core_runs

run_name: wsl_lite_vit_ln_8ts3v_min2_b4_i3000

backbone: vit_b16
train_backbone_adapters: false

fusion_mode: attention_pool
view_token_dropout: 0.15
view_token_noise_std: 0.01
attention_dropout: 0.1
projector_dropout: 0.1
pixel_aug: false
view_mask_mode: drop_one
view_mask_prob: 0.5
view_mask_min_views: 2

batch_episode_pairs: 4
num_timestamps: 8
num_multi_view: 3
camera_matched_pairing: true

gamma: 0.1
temperature: 0.1
mv_temperature: 0.1
lambda_mv: 0.5
mv_soft_temporal: true
mv_soft_temporal_alpha: 0.2
mv_soft_temporal_tau: 1.0
softdtw_mode: contrastive
softdtw_divergence: true

lr: 0.000075
max_iters: 3000
log_every: 50
save_every: 3000
