# Launch:
#   python train.py --exp_cfg_path configs/train_2a100_method2_tcc.yaml --device 0,1
#
# Method 2 TCC ablation:
#   Same robust view-set fusion as Method 2, but replaces BxB Soft-DTW
#   temporal alignment with paired TCC cycle-back on clean full-view fused
#   H/R sequences.

data_root: /home/paichichi/data/RH20T/TCC_RH20T
training_index: /home/paichichi/data/RH20T/TCC_RH20T/training_index.pt
pretrain_path: /home/paichichi/data/pretrain/D4R_IN_1M.pth
output_root: /tmp/tcc-core/multiview_softdtw_runs

run_name: train_2a100_method2_tcc_full_clean_augmask_lr7p5e5_20k

fusion_mode: attention_pool
view_token_dropout: 0.15
view_token_noise_std: 0.01
attention_dropout: 0.1
projector_dropout: 0.1
pixel_aug: true
view_mask_mode: drop_one
view_mask_prob: 0.5
view_mask_min_views: 3

batch_episode_pairs: 16
num_timestamps: 8
num_multi_view: 4
camera_matched_pairing: true

gamma: 0.1
temperature: 0.1
mv_temperature: 0.1
lambda_mv: 0.5
mv_soft_temporal: true
mv_soft_temporal_alpha: 0.2
mv_soft_temporal_tau: 1.0
softdtw_mode: tcc
tcc_loss_type: regression_mse
tcc_similarity_type: l2
tcc_label_smoothing: 0.1
tcc_variance_lambda: 0.001
tcc_huber_delta: 0.1
softdtw_divergence: true

lr: 0.000075
max_iters: 20000
log_every: 20
save_every: 1000
