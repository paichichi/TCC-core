# Launch:
#   python train.py --exp_cfg_path configs/train_2a100_method2.yaml --device 0,1
#
# Method 2:
#   Ignore camera-id slots. Fuse the sampled views as an unordered view set with
#   attention pooling. Soft-DTW uses the clean full-view embedding; auxiliary
#   InfoNCE uses two augmented full-view embeddings from the same view tokens.

data_root: /home/paichichi/data/RH20T/TCC_RH20T
training_index: /home/paichichi/data/RH20T/TCC_RH20T/training_index.pt
pretrain_path: /home/paichichi/data/pretrain/D4R_IN_1M.pth
output_root: /tmp/tcc-core/multiview_softdtw_runs

run_name: train_2a100_method2_attnpool_lr7p5e5_20k

fusion_mode: attention_pool
view_token_dropout: 0.15
view_token_noise_std: 0.01
attention_dropout: 0.1
projector_dropout: 0.1

batch_episode_pairs: 16
num_timestamps: 8
num_multi_view: 4
camera_matched_pairing: true

gamma: 0.1
temperature: 0.1
mv_temperature: 0.1
lambda_mv: 0.5
mv_soft_temporal: true  # Soft labels are only applied within each episode sequence, not across episodes.
mv_soft_temporal_alpha: 0.2
mv_soft_temporal_tau: 1.0
softdtw_mode: paired  # Change to "contrastive" to use full batch H/R 16x16 Soft-DTW negatives.
softdtw_divergence: true

lr: 0.000075
max_iters: 20000
log_every: 20
save_every: 1000
