# First-version ViT-B/16 LN-affine baseline on NeSI.
# This keeps the original fixed camera-slot fusion and hard multi-view InfoNCE.
#
# Smoke test:
#   python train.py --exp_cfg_path configs/nesi_vit_ln_first_version_8ts4v.yaml --device 0 -- --batch-episode-pairs 1 --max-iters 1 --log-every 1 --save-every 0

data_root: /nesi/nobackup/uoa04758/xzha593/datasets/RH20T
training_index: /nesi/nobackup/uoa04758/xzha593/datasets/RH20T/training_index.pt
pretrain_path: /nesi/nobackup/uoa04758/xzha593/datasets/HRAlign/pretrains/D4R_IN_1M.pth
output_root: /nesi/nobackup/uoa04758/xzha593/datasets/RH20T/runs

run_name: nesi_vit_ln_first_version_8ts4v_lr7p5e5_20k

backbone: vit_b16
train_backbone_adapters: false

fusion_mode: fixed_slot
softdtw_mode: contrastive
mv_soft_temporal: false
pixel_aug: false
view_mask_mode: none

batch_episode_pairs: 16
num_timestamps: 8
num_multi_view: 4
camera_matched_pairing: true

gamma: 0.1
temperature: 0.1
mv_temperature: 0.1
lambda_mv: 0.5
softdtw_divergence: true

lr: 0.000075
max_iters: 20000
log_every: 20
save_every: 1000
