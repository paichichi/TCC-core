# Launch:
#   python train.py --exp_cfg_path configs/train_2a100_method3_soft_alignment.yaml --device 0,1
#
# Method 3:
#   Keep Method 2 view-set attention fusion and feature-level subset
#   augmentation. Replace Soft-DTW with paired Sinkhorn soft alignment:
#   S -> P, S + temporal prior D -> teacher T, and structural prior Q
#   regularizes P to prefer bounded local progress transitions.

data_root: /home/paichichi/data/RH20T/TCC_RH20T
training_index: /home/paichichi/data/RH20T/TCC_RH20T/training_index.pt
pretrain_path: /home/paichichi/data/pretrain/D4R_IN_1M.pth
output_root: /tmp/tcc-core/multiview_softdtw_runs

run_name: train_2a100_method3_soft_alignment_lr7p5e5_20k

fusion_mode: attention_pool
view_token_dropout: 0.15
view_token_noise_std: 0.01
attention_dropout: 0.1
projector_dropout: 0.1
pixel_aug: false
view_mask_mode: drop_one
view_mask_prob: 1.0

batch_episode_pairs: 16
num_timestamps: 8
num_multi_view: 4
camera_matched_pairing: true

gamma: 0.1
temperature: 0.1
mv_temperature: 0.1
lambda_mv: 0.5
mv_soft_temporal: true
mv_soft_temporal_alpha: 0.2
mv_soft_temporal_tau: 1.0
softdtw_mode: soft_alignment
soft_alignment_temperature: 0.1
soft_alignment_epsilon: 0.05
soft_alignment_rho: 0.5
soft_alignment_sinkhorn_iters: 20
soft_alignment_struct_lambda: 0.1
soft_alignment_max_forward_step: 1.0
softdtw_divergence: true

lr: 0.000075
max_iters: 20000
log_every: 20
save_every: 1000
