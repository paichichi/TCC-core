# Launch on NeSI:
#   python train.py --exp_cfg_path configs/nesi_r3m_bn_affine_8ts4v.yaml --device 0,1
#
# Original R3M ResNet50 BN-affine baseline, 8 timestamp groups, 4 views.

data_root: /nesi/nobackup/uoa04758/xzha593/datasets/RH20T
training_index: /nesi/nobackup/uoa04758/xzha593/datasets/RH20T/training_index.pt
pretrain_path: /nesi/nobackup/uoa04758/xzha593/datasets/HRAlign/pretrains/UnadaptedR3M.pt
output_root: /nesi/nobackup/uoa04758/xzha593/datasets/RH20T/runs

run_name: nesi_r3m_bn_affine_8ts4v_lambda05_lr7p5e5_20k

backbone: r3m_resnet50
train_backbone_adapters: false

fusion_mode: attention_pool
view_token_dropout: 0.15
view_token_noise_std: 0.01
attention_dropout: 0.1
projector_dropout: 0.1
pixel_aug: false
view_mask_mode: drop_one
view_mask_prob: 0.5
view_mask_min_views: 3

batch_episode_pairs: 16
num_timestamps: 8
num_multi_view: 4
camera_matched_pairing: true

gamma: 0.1
temperature: 0.1
mv_temperature: 0.1
lambda_mv: 0.5
mv_soft_temporal: true
mv_soft_temporal_alpha: 0.2
mv_soft_temporal_tau: 1.0
softdtw_mode: contrastive
softdtw_divergence: true

lr: 0.000075
max_iters: 20000
log_every: 20
save_every: 1000
