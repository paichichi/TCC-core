# Launch:
#   python train.py --exp_cfg_path configs/train_2a100.yaml --device 0,1
#
# DDP note:
#   batch_episode_pairs is per GPU/process. With --device 0,1 and
#   batch_episode_pairs=16,
#   the job processes 32 H/R pairs per step, while contrastive negatives remain
#   local to each GPU.

data_root: /home/paichichi/data/RH20T/TCC_RH20T
training_index: /home/paichichi/data/RH20T/TCC_RH20T/training_index.pt
pretrain_path: /home/paichichi/data/pretrain/D4R_IN_1M.pth
output_root: /tmp/tcc-core/multiview_softdtw_runs

run_name: train_2a100_lr7p5e5_20k

batch_episode_pairs: 16
num_timestamps: 8
num_multi_view: 4
camera_matched_pairing: true

gamma: 0.1
temperature: 0.1
mv_temperature: 0.1
lambda_mv: 0.5
softdtw_divergence: true

lr: 0.000075
max_iters: 20000
log_every: 20
save_every: 1000
