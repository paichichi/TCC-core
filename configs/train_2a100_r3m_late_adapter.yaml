# Launch:
#   python train.py --exp_cfg_path configs/train_2a100_r3m_late_adapter.yaml --device 0,1
#
# Original R3M + HR-Align-style late adapter training:
#   Loads UnadaptedR3M.pt, inserts late adapters after the three ResNet50
#   layer4 bottleneck blocks, and trains those adapters plus BatchNorm affine
#   parameters. Adapter residual outputs are zero-initialized, so the initial
#   visual feature is equivalent to original R3M before training updates.

data_root: /home/paichichi/data/RH20T/TCC_RH20T
training_index: /home/paichichi/data/RH20T/TCC_RH20T/training_index.pt
pretrain_path: /home/paichichi/data/pretrain/UnadaptedR3M.pt
output_root: /tmp/tcc-core/multiview_softdtw_runs

run_name: train_2a100_r3m_late_adapter_8ts4v_lr7p5e5_20k

backbone: r3m_late_adapter
train_backbone_adapters: true

fusion_mode: attention_pool
view_token_dropout: 0.15
view_token_noise_std: 0.01
attention_dropout: 0.1
projector_dropout: 0.1
pixel_aug: false
view_mask_mode: drop_one
view_mask_prob: 0.5
view_mask_min_views: 3

batch_episode_pairs: 16
num_timestamps: 8
num_multi_view: 4
camera_matched_pairing: true

gamma: 0.1
temperature: 0.1
mv_temperature: 0.1
lambda_mv: 0.5
mv_soft_temporal: true
mv_soft_temporal_alpha: 0.2
mv_soft_temporal_tau: 1.0
softdtw_mode: contrastive
softdtw_divergence: true

lr: 0.000075
max_iters: 20000
log_every: 20
save_every: 1000
