# Launch on NeSI:
#   python train.py --exp_cfg_path configs/nesi_method3_resnet_ln_8ts4v.yaml --device 0,1
#
# Method 3 R3M ResNet50 late-adapter backbone, 8 timestamp groups, 4 views.
# Loads original UnadaptedR3M.pt and trains HR-Align-style late adapters.
# With 2 GPUs, global episode-pair batch = 2 * batch_episode_pairs.
# Here: 16 per GPU -> 32 global pairs/step; 20k steps -> 640k pair exposures.

data_root: /nesi/nobackup/uoa04758/xzha593/datasets/RH20T/TCC_RH20T
training_index: /nesi/nobackup/uoa04758/xzha593/datasets/RH20T/training_index.pt
pretrain_path: /nesi/nobackup/uoa04758/xzha593/datasets/HRAlign/pretrains/UnadaptedR3M.pt
output_root: /nesi/nobackup/uoa04758/xzha593/datasets/RH20T/runs

run_name: nesi_method3_resnet_ln_8ts4v_lambda05_lr1e4_20k

backbone: r3m_late_adapter
train_backbone_adapters: true

fusion_mode: attention_pool
view_token_dropout: 0.15
view_token_noise_std: 0.01
attention_dropout: 0.1
projector_dropout: 0.1
pixel_aug: false
view_mask_mode: drop_one
view_mask_prob: 1.0
view_mask_min_views: 3

batch_episode_pairs: 12 # 16
num_timestamps: 8
num_multi_view: 4
camera_matched_pairing: true

gamma: 0.1
temperature: 0.1
mv_temperature: 0.1
lambda_sa: 1.0
lambda_mv: 0.5
mv_soft_temporal: true
mv_soft_temporal_alpha: 0.2
mv_soft_temporal_tau: 1.0
softdtw_mode: soft_alignment
soft_alignment_temperature: 0.1
soft_alignment_epsilon: 0.05
soft_alignment_rho: 0.5
soft_alignment_sinkhorn_iters: 20
soft_alignment_struct_lambda: 0.1
soft_alignment_max_forward_step: 1.0
softdtw_divergence: true

lr: 0.0001
max_iters: 20000
log_every: 20
save_every: 1000
