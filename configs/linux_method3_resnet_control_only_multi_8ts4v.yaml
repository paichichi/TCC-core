# ResNet Method 3 multi-view Control-only ablation.
#
# Single-GPU launch:
#   python train.py \
#     --exp_cfg_path configs/linux_method3_resnet_control_spatial_8ts4v.yaml \
#     --device 0

data_root: /home/paichichi/data/RH20T/TCC_RH20T
training_index: /home/paichichi/data/RH20T/TCC_RH20T/training_index.pt
pretrain_path: /home/paichichi/data/pretrain/UnadaptedR3M.pt
output_root: /home/paichichi/projects/TCC-core/wsl_result/tcc_core_runs

run_name: linux_method3_resnet_control_only_multi_8ts4v_b24_seed1_i40000

backbone: r3m_late_adapter
train_backbone_adapters: true
train_backbone_norm_affine: false
adapter_domain: robot_only

fusion_mode: attention_pool
view_mode: multi
representation_mode: backbone_pooled
view_token_dropout: 0.0
view_token_noise_std: 0.0
attention_dropout: 0.0
projector_dropout: 0.0
pixel_aug: false
view_mask_mode: drop_one
view_mask_prob: 1.0
view_mask_min_views: 3
aux_teacher_stop_grad: true
aux_global_negatives: false
prefetch_batches: 0
pin_memory: true

# One RTX 5090; this capacity was already verified for the 8x4 setup.
batch_episode_pairs: 24
num_timestamps: 8
num_multi_view: 4
camera_matched_pairing: true

gamma: 0.1
temperature: 0.1
mv_temperature: 0.1
lambda_sa: 1.0
lambda_mv: 0.5
mv_soft_temporal: true
mv_soft_temporal_alpha: 0.2
mv_soft_temporal_tau: 1.0
softdtw_mode: soft_alignment
soft_alignment_temperature: 0.1
soft_alignment_epsilon: 0.05
soft_alignment_rho: 0.5
soft_alignment_sinkhorn_iters: 20
soft_alignment_struct_lambda: 0.1
soft_alignment_max_forward_step: 1.0
softdtw_divergence: true

# The adapted Robot branch must outperform frozen R3M under one teacher.
lambda_control_gain: 1.0
control_gain_margin: 0.02

# Disable Spatial Preservation while retaining its raw diagnostic metrics.
lambda_spatial_preserve: 0.0
spatial_preserve_tolerance: 0.2

lr: 0.0001
weight_decay: 0.0
seed: 1
amp_dtype: bfloat16
max_iters: 40000
log_every: 20
save_every: 1000
