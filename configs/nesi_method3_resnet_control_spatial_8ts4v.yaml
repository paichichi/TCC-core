# ResNet Method 3 v2.1: asymmetric H/R adapter training with two safeguards.
#
#   H = frozen R3M(H)
#   R_adapted = Adapter(frozen R3M(R))
#   R_control = frozen R3M(R)
#
# The adapted and control Robot branches are scored against the same detached
# Soft Alignment teacher. The spatial term is a same-Robot feature-map trust
# region before global pooling; it is not Human/Robot pixel alignment.
#
# Single-GPU launch:
#   python train.py \
#     --exp_cfg_path configs/nesi_method3_resnet_control_spatial_8ts4v.yaml \
#     --device 0

data_root: /nesi/nobackup/uoa04758/xzha593/datasets/RH20T/TCC_RH20T
training_index: /nesi/nobackup/uoa04758/xzha593/datasets/RH20T/training_index.pt
pretrain_path: /nesi/nobackup/uoa04758/xzha593/datasets/HRAlign/pretrains/UnadaptedR3M.pt
output_root: /nesi/nobackup/uoa04758/xzha593/datasets/RH20T/runs

run_name: nesi_method3_resnet_counterfactual_spatial_v1_8ts4v_seed1_40k

backbone: r3m_late_adapter
train_backbone_adapters: true
train_backbone_norm_affine: false
adapter_domain: robot_only

fusion_mode: attention_pool
view_mode: multi
representation_mode: backbone_pooled
view_token_dropout: 0.0
view_token_noise_std: 0.0
attention_dropout: 0.0
projector_dropout: 0.0
pixel_aug: false
view_mask_mode: drop_one
view_mask_prob: 1.0
view_mask_min_views: 3
aux_teacher_stop_grad: true
aux_global_negatives: false

# One GPU, matching the previously verified 24 episode-pair capacity.
batch_episode_pairs: 24
num_timestamps: 8
num_multi_view: 4
camera_matched_pairing: true

gamma: 0.1
temperature: 0.1
mv_temperature: 0.1
lambda_sa: 1.0
lambda_mv: 0.5
mv_soft_temporal: true
mv_soft_temporal_alpha: 0.2
mv_soft_temporal_tau: 1.0
softdtw_mode: soft_alignment
soft_alignment_temperature: 0.1
soft_alignment_epsilon: 0.05
soft_alignment_rho: 0.5
soft_alignment_sinkhorn_iters: 20
soft_alignment_struct_lambda: 0.1
soft_alignment_max_forward_step: 1.0
softdtw_divergence: true

# Issue 1: the adapter must beat frozen R3M under the same teacher.
lambda_control_gain: 1.0
control_gain_margin: 0.02

# Issue 2: retain each location's direction and magnitude before pooling.
lambda_spatial_preserve: 0.1
spatial_preserve_tolerance: 0.2

lr: 0.0001
seed: 1
amp_dtype: bfloat16
max_iters: 40000
log_every: 20
save_every: 1000
